name: Build and publish .mcpb

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'skills/**'
      - 'tests/**'
      - 'manifest.json'
      - 'package.json'
      # server.json (repo root) and scripts/** are what PUBLISH the
      # registry entry. 'server/**' is a directory and matches neither, so
      # without these two lines a fix to the checksum stamper — or the
      # registry rename itself, which is a server.json-only edit — pushes
      # green and never deploys.
      - 'server.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # contents:write so we can publish a tagged GitHub Release carrying the
    # .mcpb — the stable, versioned artifact the Claude extension directory
    # tracks for auto-update, and a clean public download in its own right.
    permissions:
      contents: write
      # OIDC. GitHub mints a short-lived token proving this workflow runs
      # in this repo, which is what authorises publishing under the
      # io.github.justinwilliames/* namespace. No stored secret exists to
      # expire silently — which is exactly how the previous registry
      # token died, unnoticed, leaving the registry stale for weeks.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # Fail the build only on high-or-critical severity advisories so
      # noise from low/moderate findings doesn't block shipping. Pinned
      # to --production so dev-only deps (esbuild, mcpb tooling) don't
      # gate releases — they don't ship in the .mcpb.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The test suite (tests/suites/*.test.mjs, run via `npm test`) is
      # the actual quality gate — contract tests, manifest-drift guard,
      # Braze/Stripo/ESP flows, calculator correctness. A release with a
      # failing test never reaches the bucket or the GitHub Release.
      # ORBIT_TELEMETRY=0 belt-and-braces: the test harness already forces
      # it off per-spawn, but CI runs on an ephemeral HOME, so any event
      # that did escape would mint a brand-new "install" in the same table
      # the relaunch is measured by — a release job must never look like a
      # user.
      - name: Run tests
        env:
          ORBIT_TELEMETRY: '0'
        run: npm test

      - run: npm run build:extension

      # Package the .mcpb bundle for distribution.
      - name: Package .mcpb
        run: |
          cd .mcpb-build
          zip -r ../orbit-lifecycle-marketing-system-for-claude.mcpb . -x "*.DS_Store"

      # Extract the version from manifest.json so the versioned key in
      # the bucket matches the release. Jobs downstream use this env var.
      - name: Extract version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building orbit-v$VERSION"

      # Upload to the private Railway-backed Tigris bucket. Three
      # objects per release:
      #   - mcpb/orbit-v{version}.mcpb   — immutable versioned archive
      #   - mcpb/latest.mcpb             — always-latest alias (the
      #                                    one /api/mcpb-download serves)
      #   - manifest.json                — proxied by
      #                                    /api/orbit/latest-version
      # The website only reads these via signed URLs — the bucket
      # itself is private, no public ingress.
      - name: Upload to MCPB bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ORBIT_MCPB_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ORBIT_MCPB_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.ORBIT_MCPB_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.ORBIT_MCPB_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.ORBIT_MCPB_S3_BUCKET }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            orbit-lifecycle-marketing-system-for-claude.mcpb \
            "s3://$S3_BUCKET/mcpb/orbit-v$VERSION.mcpb" \
            --content-type application/zip
          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            orbit-lifecycle-marketing-system-for-claude.mcpb \
            "s3://$S3_BUCKET/mcpb/latest.mcpb" \
            --content-type application/zip
          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            manifest.json \
            "s3://$S3_BUCKET/manifest.json" \
            --content-type application/json
          echo "Uploaded orbit-v$VERSION.mcpb, latest.mcpb, and manifest.json"

      # Publish a tagged GitHub Release with the .mcpb attached. This is the
      # versioned, stable-URL artifact the Claude extension directory tracks
      # for auto-update, and a public download path in its own right. Skips
      # cleanly if a release for this version already exists (re-run safety).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — updating asset."
            gh release upload "v$VERSION" \
              orbit-lifecycle-marketing-system-for-claude.mcpb --clobber
          else
            gh release create "v$VERSION" \
              orbit-lifecycle-marketing-system-for-claude.mcpb \
              --title "Orbit v$VERSION" \
              --latest \
              --notes "Orbit MCPB v$VERSION. Free, no account and no key required. Install: download the .mcpb and double-click it (Claude Desktop replaces any older version in place)."
          fi

      # Publish to the MCP registry from the asset we just uploaded.
      #
      # This step exists because the manual version of it produced a live
      # registry entry whose fileSha256 did not match its own release
      # asset — so an installer that honours the checksum refused the
      # download, on the one channel built for strangers. The hash is
      # computed here from the exact bytes that were released; nothing is
      # typed by hand. Skips cleanly if the publisher isn't configured, so
      # a missing token degrades to "the registry is stale," not a failed
      # release.
      - name: Stamp and publish the MCP registry entry
        run: |
          set -euo pipefail
          node scripts/build-server-json.mjs \
            orbit-lifecycle-marketing-system-for-claude.mcpb
          cat server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar -xz mcp-publisher
          # OIDC, not a PAT. Two reasons the previous form could not work:
          # `publish` takes no --token flag at all (it silently ignores
          # one and publishes unauthenticated), and the secret it depended
          # on had already expired once without anyone noticing.
          # `login github-oidc` needs no stored credential.
          # Validate BEFORE authenticating. The registry rejects on schema
          # server-side anyway, but only after a full build, a package, an
          # S3 upload and a GitHub Release have already happened — so a
          # 100-character description limit failed the run at the last
          # step with everything else already published. This is the same
          # check, run against the file we just stamped, for free.
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          # No `|| echo` here. A swallowed publish failure is exactly the
          # bug this step was written to fix, relocated into YAML where it
          # is harder to notice.
          ./mcp-publisher publish
          echo "Registry entry published — reading it back."

      # Retire the pre-rename entry, pointing at its successor.
      #
      # io.github.justinwilliames/orbit-for-claude still serves v0.27.7 —
      # the PAID, licence-gated build, against a pricing page that no
      # longer exists. Renaming alone would leave that live forever:
      # a new name creates a new entry, it does not move the old one.
      # Anyone who already found Orbit by the old name keeps installing a
      # build that demands a key.
      #
      # Idempotent and non-fatal: once deprecated it stays deprecated, and
      # a failure here must not fail a release whose artifact is already
      # published and correct.
      - name: Deprecate the pre-rename registry entry
        continue-on-error: true
        run: |
          set -uo pipefail
          LEGACY="io.github.justinwilliames/orbit-for-claude"
          CURRENT=$(node -p "require('./server.json').name")
          if [ "$LEGACY" = "$CURRENT" ]; then
            echo "Current name is the legacy name — nothing to retire."
            exit 0
          fi
          ./mcp-publisher status \
            --status deprecated \
            --all-versions \
            --message "Renamed to ${CURRENT}. This entry serves an old, licence-gated build; Orbit is now free with no key. Install ${CURRENT} instead." \
            "$LEGACY" || echo "::warning::Could not deprecate ${LEGACY} — it may already be deprecated, or never have been published under this account."

      # Read the LIVE registry entry back and assert it matches what we
      # just stamped. A 2xx from the publisher is a claim; this is the
      # observation. Without it, "the registry serves a checksum that does
      # not match its own asset" stays undetectable until a stranger's
      # installer refuses the download.
      - name: Verify the published registry entry
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./server.json').name")
          WANT_VERSION=$(node -p "require('./server.json').version")
          WANT_SHA=$(node -p "
            const s = require('./server.json');
            const p = (s.packages || []).find(p => p.fileSha256) || {};
            p.fileSha256 || '';
          ")
          echo "Expecting $NAME v$WANT_VERSION sha256=$WANT_SHA"
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$NAME" || echo '')
            GOT=$(node -e "
              let d = {}; try { d = JSON.parse(process.argv[1] || '{}'); } catch {}
              const list = d.servers || [];
              const hit = list.find(s => (s.name || s.server?.name) === process.argv[2]);
              const srv = hit?.server ?? hit ?? {};
              const pkg = (srv.packages || []).find(p => p.fileSha256) || {};
              console.log((srv.version || '') + ' ' + (pkg.fileSha256 || ''));
            " "$BODY" "$NAME")
            if [ "$GOT" = "$WANT_VERSION $WANT_SHA" ]; then
              echo "Registry readback OK: $GOT"
              exit 0
            fi
            echo "Registry not consistent yet (got '$GOT') — retrying in 15s (attempt $attempt/5)."
            sleep 15
          done
          echo "::error::Registry readback never matched the stamped server.json (wanted '$WANT_VERSION $WANT_SHA'). The registry is serving an entry that does not describe this release."
          exit 1

      # Notify the get-orbit website immediately that a new MCPB
      # version is live. Triggers the sync-mcpb-version workflow
      # there, which updates lib/orbit-version.ts + pushes → Railway
      # auto-deploys. get-orbit also still polls once a day as a
      # safety net, so a missing/expired token here degrades to "the
      # website is stale for at most a day," not silently forever —
      # this exact dispatch existed once before and got quietly
      # dropped when its PAT expired without anyone noticing, so the
      # step below no-ops loudly (echoes a warning) rather than
      # failing the build, and the daily cron on the other side is
      # the actual fix for the silent-expiry failure mode this time.
      #
      # Needs a PAT scoped `repo` (classic) or with `Contents: write`
      # on justinwilliames/get-orbit, stored as
      # ORBIT_WEBSITE_DISPATCH_TOKEN in this repo's Actions secrets.
      # If the secret isn't set, this step skips cleanly so the build
      # still succeeds; the daily cron will catch up.
      - name: Notify website of new release
        if: ${{ success() }}
        env:
          DISPATCH_TOKEN: ${{ secrets.ORBIT_WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "ORBIT_WEBSITE_DISPATCH_TOKEN not set — skipping website dispatch. Daily cron on get-orbit will pick up the release within 24h."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/justinwilliames/get-orbit/dispatches \
            -d "{\"event_type\":\"mcpb-released\",\"client_payload\":{\"version\":\"$VERSION\"}}" \
            && echo "Website dispatch fired for v$VERSION" \
            || echo "Website dispatch failed — daily cron will catch up."
