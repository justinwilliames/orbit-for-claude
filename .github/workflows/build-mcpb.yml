name: Build and publish .mcpb

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'skills/**'
      - 'tests/**'
      - 'manifest.json'
      - 'package.json'
      # server.json (repo root) and scripts/** are what PUBLISH the
      # registry entry. 'server/**' is a directory and matches neither, so
      # without these two lines a fix to the checksum stamper — or the
      # registry rename itself, which is a server.json-only edit — pushes
      # green and never deploys.
      - 'server.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Build, test, package and validate server.json, then stop before
          anything leaves the runner. Use this to debug the pipeline — five
          public releases got cut in 39 minutes chasing one broken step, and
          a version number spent debugging is spent forever.
        type: boolean
        default: false
      allow_republish:
        description: >-
          Republish a version the registry already holds. Off by default,
          and the guard below refuses without it — a re-run of a shipped
          version clobbers the public asset and stamps a NEW checksum for
          a version whose registry entry is immutable, so the entry ends
          up describing bytes that no longer exist at that URL. Bump the
          version instead; this switch exists for the rare case where the
          published asset is known to be broken.
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # contents:write so we can publish a tagged GitHub Release carrying the
    # .mcpb — the stable, versioned artifact the Claude extension directory
    # tracks for auto-update, and a clean public download in its own right.
    permissions:
      contents: write
      # OIDC. GitHub mints a short-lived token proving this workflow runs
      # in this repo, which is what authorises publishing under the
      # io.github.justinwilliames/* namespace. No stored secret exists to
      # expire silently — which is exactly how the previous registry
      # token died, unnoticed, leaving the registry stale for weeks.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # Fail the build only on high-or-critical severity advisories so
      # noise from low/moderate findings doesn't block shipping. Pinned
      # to --production so dev-only deps (esbuild, mcpb tooling) don't
      # gate releases — they don't ship in the .mcpb.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The test suite (tests/suites/*.test.mjs, run via `npm test`) is
      # the actual quality gate — contract tests, manifest-drift guard,
      # Braze/Stripo/ESP flows, calculator correctness. A release with a
      # failing test never reaches the bucket or the GitHub Release.
      # ORBIT_TELEMETRY=0 belt-and-braces: the test harness already forces
      # it off per-spawn, but CI runs on an ephemeral HOME, so any event
      # that did escape would mint a brand-new "install" in the same table
      # the relaunch is measured by — a release job must never look like a
      # user.
      - name: Run tests
        env:
          ORBIT_TELEMETRY: '0'
        run: npm test

      - run: npm run build:extension

      # Package the .mcpb bundle for distribution.
      - name: Package .mcpb
        run: |
          cd .mcpb-build
          zip -r ../orbit-lifecycle-marketing-system-for-claude.mcpb . -x "*.DS_Store"

      # Extract the version from manifest.json so the versioned key in
      # the bucket matches the release. Jobs downstream use this env var.
      - name: Extract version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building orbit-v$VERSION"

      # Everything a broken pipeline used to need a public version number to
      # discover — the build, the tests, the package, and the schema shape
      # the registry rejects on — happens above this line. Stop here.
      - name: Dry run — validate server.json and stop
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          node scripts/build-server-json.mjs \
            orbit-lifecycle-marketing-system-for-claude.mcpb
          cat server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher validate server.json
          echo "Dry run OK. Nothing was uploaded, released, published or promoted."

      # Upload to the private Railway-backed Tigris bucket.
      #
      # ORDERING, which cost two public version numbers to learn: this step
      # and the GitHub Release below are IRREVERSIBLE, and they used to run
      # before the registry publish and readback. Three of the last five runs
      # went red after them, so v0.28.1 and v0.28.2 are public releases that
      # were served as latest.mcpb and never reached the registry.
      #
      # What moved: the two "this is the current build" promotions —
      # mcpb/latest.mcpb and the release's --latest flag — now happen AFTER
      # the readback, in "Promote to latest". The immutable versioned objects
      # still land here, because the registry entry stamps a checksum of a
      # published asset and cannot be published against one that does not
      # exist yet. A draft release does NOT work for the same reason: its
      # /releases/download/ URL is not publicly resolvable, and
      # build-server-json.mjs stamps that URL into an IMMUTABLE registry
      # version — it would pin the registry to a permanent 404.
      #
      # Objects per release:
      #   - mcpb/orbit-v{version}.mcpb   — immutable versioned archive
      #   - mcpb/latest.mcpb             — always-latest alias (the one
      #                                    /api/mcpb-download serves), written
      #                                    only after the readback passes
      #   - manifest.json                — proxied by
      #                                    /api/orbit/latest-version
      # The website only reads these via signed URLs — the bucket
      # itself is private, no public ingress.
      # Refuse to re-release a version the registry already holds.
      #
      # This workflow fires on any push to main touching server/**, reads
      # the version from manifest.json, and if a release for it exists it
      # --clobbers the public asset. That replaces the "immutable
      # versioned archive" in S3 and stamps a fresh sha256 for a version
      # the registry has already frozen — so the readback fails AFTER the
      # public bytes have been swapped, leaving the registry describing a
      # file that is no longer there, and "Promote to latest" never runs.
      # Nothing in the suite compared the version against what is
      # published; the only version assertion checks the three local files
      # agree with each other, which they would.
      #
      # One HTTP call: the same versions endpoint the readback already
      # uses, assertion inverted.
      #
      # TWO things this step got wrong on the day it was written, both
      # caught by running its own body rather than reading it:
      #
      #  1. `curl -fsS ... || echo ''` swallowed every transport failure.
      #     A 404, a DNS failure, a registry outage or a rate limit all
      #     produced an empty body, which parsed to "not published", which
      #     printed "safe to publish" and exited 0 — waving through the
      #     `gh release upload --clobber` on the only irreversible step in
      #     the pipeline. Verified: pointing the same URL at an
      #     unresolvable host flipped 0.29.0 from REFUSED to "safe". It is
      #     the same shell-fallback-echoes-on-failure shape the last cycle
      #     caught twice, reintroduced inside the fix for it. A guard that
      #     cannot reach its source of truth must REFUSE, not wave through.
      #     So: capture the status code, and treat anything that is not a
      #     clean 200 or a clean 404 as unknown, which is a failure.
      #
      #  2. It ended in `exit 1` on a `push`. This workflow fires on every
      #     push to main touching server/**, so from that moment any push
      #     that did not also bump the version failed the job — 34 of the
      #     last 40 qualifying commits did exactly that, eight of them in a
      #     row at one version. "This version is already published" is not
      #     an error on a push, it is "nothing to release", and collapsing
      #     the two makes a red main stop meaning anything. On a push we
      #     set publish=false and the release steps skip; on a manual
      #     workflow_dispatch, asking to re-release a published version IS
      #     an error and still exits 1.
      - name: Refuse to re-release a published version
        id: republish_guard
        if: ${{ !inputs.dry_run && !inputs.allow_republish }}
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          NAME=$(node -e "console.log(require('./server.json').name)")
          ENC=$(node -p "encodeURIComponent(process.argv[1])" "$NAME")
          # Overridable so tests/suites/40-release-guard.test.mjs can point
          # the same body at a local server and at an unresolvable host.
          # A guard nobody can run against a failure is a guard nobody has
          # checked — which is how the `|| echo ''` above shipped.
          REGISTRY_BASE="${REGISTRY_BASE:-https://registry.modelcontextprotocol.io}"
          HTTP=$(curl -sS -o versions.json -w '%{http_code}' \
            "${REGISTRY_BASE}/v0/servers/${ENC}/versions" || echo 000)
          case "$HTTP" in
            200)
              ALREADY=$(node -e "
                let d = {};
                try { d = JSON.parse(require('fs').readFileSync('versions.json', 'utf8')); } catch {}
                const list = d.servers || d.versions || [];
                if (!Array.isArray(list) || list.length === 0) { console.log('unreadable'); }
                else {
                  const hit = list.map((s) => s.server ?? s).find((s) => s.version === process.argv[1]);
                  console.log(hit ? 'yes' : 'no');
                }
              " "$VERSION")
              ;;
            404)
              # No entry under this name at all — a first publish.
              echo "No registry entry for $NAME yet; this is a first publish."
              ALREADY=no
              ;;
            *)
              ALREADY=unreachable
              ;;
          esac

          if [ "$ALREADY" = "unreachable" ] || [ "$ALREADY" = "unreadable" ]; then
            echo "::error::The MCP registry returned HTTP $HTTP for $NAME, so this run cannot prove version $VERSION is unpublished. Refusing to publish blind — a re-release swaps the public .mcpb bytes under a checksum the registry has already frozen. Re-run when the registry is reachable."
            exit 1
          fi

          if [ "$ALREADY" = "yes" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::Version $VERSION is already published to the MCP registry as $NAME. Publishing it again would overwrite the public .mcpb and stamp a new checksum against a registry entry that cannot change, so anyone verifying the hash would be refused the download. Bump the version in package.json, manifest.json and server.json — or re-run this workflow manually with allow_republish if the published asset is known to be broken."
              exit 1
            fi
            echo "::notice::Version $VERSION is already published as $NAME. Nothing to release from this push — build and tests ran, the publish steps are skipped. Bump the version when you want a release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version $VERSION is not yet on the registry — safe to publish."
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Upload to MCPB bucket
        if: ${{ !inputs.dry_run && steps.republish_guard.outputs.publish != 'false' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ORBIT_MCPB_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ORBIT_MCPB_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.ORBIT_MCPB_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.ORBIT_MCPB_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.ORBIT_MCPB_S3_BUCKET }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            orbit-lifecycle-marketing-system-for-claude.mcpb \
            "s3://$S3_BUCKET/mcpb/orbit-v$VERSION.mcpb" \
            --content-type application/zip
          echo "Uploaded orbit-v$VERSION.mcpb (versioned only — latest.mcpb and manifest.json are promoted after the registry readback)"

      # Publish a tagged GitHub Release with the .mcpb attached. This is the
      # versioned, stable-URL artifact the Claude extension directory tracks
      # for auto-update, and a public download path in its own right. Skips
      # cleanly if a release for this version already exists (re-run safety).
      #
      # NOT --latest. The release must exist and be publicly resolvable for
      # the registry to hash its URL, but marking it "latest" is the claim
      # that it is the build people should get — and that claim is only
      # earned once the readback below passes. "Promote to latest" sets it.
      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run && steps.republish_guard.outputs.publish != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — updating asset."
            gh release upload "v$VERSION" \
              orbit-lifecycle-marketing-system-for-claude.mcpb --clobber
          else
            gh release create "v$VERSION" \
              orbit-lifecycle-marketing-system-for-claude.mcpb \
              --title "Orbit v$VERSION" \
              --latest=false \
              --notes "Orbit MCPB v$VERSION. Free, no account and no key required. Install: download the .mcpb and double-click it (Claude Desktop replaces any older version in place)."
          fi

      # Publish to the MCP registry from the asset we just uploaded.
      #
      # This step exists because the manual version of it produced a live
      # registry entry whose fileSha256 did not match its own release
      # asset — so an installer that honours the checksum refused the
      # download, on the one channel built for strangers. The hash is
      # computed here from the exact bytes that were released; nothing is
      # typed by hand. Skips cleanly if the publisher isn't configured, so
      # a missing token degrades to "the registry is stale," not a failed
      # release.
      - name: Stamp and publish the MCP registry entry
        if: ${{ !inputs.dry_run && steps.republish_guard.outputs.publish != 'false' }}
        run: |
          set -euo pipefail
          node scripts/build-server-json.mjs \
            orbit-lifecycle-marketing-system-for-claude.mcpb
          cat server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar -xz mcp-publisher
          # OIDC, not a PAT. Two reasons the previous form could not work:
          # `publish` takes no --token flag at all (it silently ignores
          # one and publishes unauthenticated), and the secret it depended
          # on had already expired once without anyone noticing.
          # `login github-oidc` needs no stored credential.
          # Validate BEFORE authenticating. The registry rejects on schema
          # server-side anyway, but only after a full build, a package, an
          # S3 upload and a GitHub Release have already happened — so a
          # 100-character description limit failed the run at the last
          # step with everything else already published. This is the same
          # check, run against the file we just stamped, for free.
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          # No `|| echo` here. A swallowed publish failure is exactly the
          # bug this step was written to fix, relocated into YAML where it
          # is harder to notice.
          ./mcp-publisher publish
          echo "Registry entry published — reading it back."

      # Retire the pre-rename entry, pointing at its successor.
      #
      # io.github.justinwilliames/orbit-for-claude still serves v0.27.7 —
      # the PAID, licence-gated build, against a pricing page that no
      # longer exists. Renaming alone would leave that live forever:
      # a new name creates a new entry, it does not move the old one.
      # Anyone who already found Orbit by the old name keeps installing a
      # build that demands a key.
      #
      # Idempotent and non-fatal: once deprecated it stays deprecated, and
      # a failure here must not fail a release whose artifact is already
      # published and correct.
      - name: Deprecate the pre-rename registry entry
        if: ${{ !inputs.dry_run && steps.republish_guard.outputs.publish != 'false' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          LEGACY="io.github.justinwilliames/orbit-for-claude"
          CURRENT=$(node -p "require('./server.json').name")
          if [ "$LEGACY" = "$CURRENT" ]; then
            echo "Current name is the legacy name — nothing to retire."
            exit 0
          fi
          # `status` PROMPTS ("Continue? [y/N]") and there is no --yes flag.
          # In CI stdin is empty, so it reads EOF and dies — and because
          # the fallback below is an echo, the step went GREEN while the
          # old entry stayed active. Feed it the confirmation.
          if echo y | ./mcp-publisher status \
              --status deprecated \
              --all-versions \
              --message "Renamed to ${CURRENT}. This entry serves an old, licence-gated build; Orbit is now free with no key. Install ${CURRENT} instead." \
              "$LEGACY"; then
            echo "Deprecated ${LEGACY}."
          else
            # Say what actually happened. The previous wording guessed
            # ("may already be deprecated") and was wrong — it had failed
            # on an interactive prompt, and the guess sent the next reader
            # looking in the wrong place.
            echo "::warning::Could not deprecate ${LEGACY}. Check the log above for the publisher's own error before assuming it is already retired."
          fi

          # Read it back. A status change is a claim until the registry
          # agrees — and this exact step reported success once while
          # changing nothing at all.
          LEGACY_STATUS=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${LEGACY##*/}" \
            | node -e "
              let d = {}; try { d = JSON.parse(require('fs').readFileSync(0, 'utf8')); } catch {}
              const hits = (d.servers || []).filter(s => (s.server?.name ?? s.name) === process.argv[1]);
              const statuses = hits.map(s => (s._meta?.['io.modelcontextprotocol.registry/official']?.status) ?? '?');
              console.log(statuses.join(',') || 'not-found');
            " "$LEGACY" || echo "readback-failed")
          echo "Legacy entry status now: ${LEGACY_STATUS}"
          case "$LEGACY_STATUS" in
            *active*) echo "::warning::${LEGACY} is STILL active — it keeps serving the old licence-gated build to anyone who finds it by the old name." ;;
          esac

      # Read the LIVE registry entry back and assert it matches what we
      # just stamped. A 2xx from the publisher is a claim; this is the
      # observation. Without it, "the registry serves a checksum that does
      # not match its own asset" stays undetectable until a stranger's
      # installer refuses the download.
      - name: Verify the published registry entry
        if: ${{ !inputs.dry_run && steps.republish_guard.outputs.publish != 'false' }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./server.json').name")
          WANT_VERSION=$(node -p "require('./server.json').version")
          WANT_SHA=$(node -p "
            const s = require('./server.json');
            const p = (s.packages || []).find(p => p.fileSha256) || {};
            p.fileSha256 || '';
          ")
          echo "Expecting $NAME v$WANT_VERSION sha256=$WANT_SHA"
          # Query the VERSIONS endpoint and match the exact version we
          # stamped. The previous form searched ?search=$NAME and took the
          # first hit — but search returns every version as its own entry,
          # so it read 0.28.3 while 0.28.4 sat in the same response marked
          # isLatest. That is a false negative on every future release: the
          # registry was right and the check that guards it was wrong.
          ENC=$(node -p "encodeURIComponent(process.argv[1])" "$NAME")
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers/${ENC}/versions" || echo '')
            GOT=$(node -e "
              let d = {}; try { d = JSON.parse(process.argv[1] || '{}'); } catch {}
              const list = d.servers || d.versions || [];
              const hit = list
                .map((s) => s.server ?? s)
                .find((s) => s.version === process.argv[2]);
              const pkg = (hit?.packages || []).find((p) => p.fileSha256) || {};
              console.log(hit ? (hit.version + ' ' + (pkg.fileSha256 || '')) : 'version-not-published');
            " "$BODY" "$WANT_VERSION")
            if [ "$GOT" = "$WANT_VERSION $WANT_SHA" ]; then
              echo "Registry readback OK: $GOT"
              exit 0
            fi
            echo "Registry not consistent yet (got '$GOT') — retrying in 15s (attempt $attempt/5)."
            sleep 15
          done
          echo "::error::Registry readback never matched the stamped server.json (wanted '$WANT_VERSION $WANT_SHA'). The registry is serving an entry that does not describe this release."
          exit 1

      # Everything above can fail and leave the world consistent: the
      # versioned objects and the un-flagged release are additive, and
      # nothing yet points anyone at them. THIS step is where the release
      # becomes the one strangers get, and it only runs once the registry
      # has been read back and agreed.
      - name: Promote to latest
        if: ${{ !inputs.dry_run && steps.republish_guard.outputs.publish != 'false' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ORBIT_MCPB_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ORBIT_MCPB_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.ORBIT_MCPB_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.ORBIT_MCPB_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.ORBIT_MCPB_S3_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            orbit-lifecycle-marketing-system-for-claude.mcpb \
            "s3://$S3_BUCKET/mcpb/latest.mcpb" \
            --content-type application/zip
          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            manifest.json \
            "s3://$S3_BUCKET/manifest.json" \
            --content-type application/json
          gh release edit "v$VERSION" --latest
          echo "Promoted v$VERSION: latest.mcpb, manifest.json, and the GitHub Release's latest flag."

      # Notify the get-orbit website immediately that a new MCPB
      # version is live. Triggers the sync-mcpb-version workflow
      # there, which updates lib/orbit-version.ts + pushes → Railway
      # auto-deploys. get-orbit also still polls once a day as a
      # safety net, so a missing/expired token here degrades to "the
      # website is stale for at most a day," not silently forever —
      # this exact dispatch existed once before and got quietly
      # dropped when its PAT expired without anyone noticing, so the
      # step below no-ops loudly (echoes a warning) rather than
      # failing the build, and the daily cron on the other side is
      # the actual fix for the silent-expiry failure mode this time.
      #
      # Needs a PAT scoped `repo` (classic) or with `Contents: write`
      # on justinwilliames/get-orbit, stored as
      # ORBIT_WEBSITE_DISPATCH_TOKEN in this repo's Actions secrets.
      #
      # IT IS NOT SET, AND HAS NEVER BEEN SET. Checked 13 Aug 2026:
      # `gh run list --workflow=sync-mcpb-version.yml --limit 100` on
      # get-orbit returns ZERO repository_dispatch runs, and this step's
      # own log on the v0.29.0 release reads "ORBIT_WEBSITE_DISPATCH_TOKEN
      # not set — skipping website dispatch", green. The comment above
      # warned that this exact dispatch had once been silently dropped by
      # an expiring PAT; it was then rebuilt in a shape where never
      # having been armed at all is equally invisible.
      #
      # Two changes, neither of which can fail a release:
      #
      #  1. The messages are `::warning::` annotations. A warning lands on
      #     the run summary, where somebody sees it. A bare `echo` lands in
      #     a 20,000-line log, which is where this one lived for a month.
      #  2. `curl ... || echo` is gone. That is the swallow-shape this
      #     pipeline has now been bitten by three times — a fallback that
      #     echoes on failure and therefore exits 0. A rejected token and
      #     a delivered dispatch printed two different sentences and both
      #     read as success; now the failure is annotated and the reason
      #     (HTTP status) is printed with it.
      #
      # Still deliberately non-fatal: the package IS published, and the
      # sibling repo's hourly cron picks the release up regardless. The
      # bug was never that this step is soft — it is that it was silent.
      - name: Notify website of new release
        if: ${{ success() && !inputs.dry_run && steps.republish_guard.outputs.publish != 'false' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.ORBIT_WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::ORBIT_WEBSITE_DISPATCH_TOKEN is not set, so the website was NOT notified of v$VERSION. yourorbit.team will keep advertising the previous version and tool count until its hourly cron catches up. Set the secret to make release pickup immediate."
            exit 0
          fi
          HTTP=$(curl -sS -o dispatch-body.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/justinwilliames/get-orbit/dispatches \
            -d "{\"event_type\":\"mcpb-released\",\"client_payload\":{\"version\":\"$VERSION\"}}" || echo 000)
          # 204 is the documented success for this endpoint. Anything else
          # — including the 000 that means curl never completed — is a
          # dispatch that did not happen, and must not print like one.
          if [ "$HTTP" = "204" ]; then
            echo "Website dispatch fired for v$VERSION (HTTP 204)."
          else
            echo "::warning::Website dispatch for v$VERSION FAILED with HTTP $HTTP — the token is set but did not work. yourorbit.team will lag until its hourly cron runs."
            cat dispatch-body.txt || true
          fi
